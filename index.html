<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f6" />
    <title>默写单词 · 国内访问版</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./assets/lucide.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i data-lucide="book-open-text"></i>
          </span>
          <div class="brand-copy">
            <div class="brand-title">默写单词</div>
            <div class="brand-subtitle" id="brandSubtitle">准备开始</div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="date-chip" id="dateChip"></div>
          <button class="icon-button" id="clearSessionButton" type="button" aria-label="重置学习记录" title="重置学习记录">
            <i data-lucide="rotate-ccw"></i>
          </button>
        </div>
      </header>

      <main class="app-main">
        <section class="view is-active" id="libraryView" aria-labelledby="libraryTitle">
          <div class="library-layout">
            <section class="panel add-panel" aria-labelledby="addTitle">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">词库编辑</p>
                  <h2 id="addTitle">添加单词</h2>
                </div>
                <span class="count-badge" id="libraryCount">0 个</span>
              </div>

              <label class="sr-only" for="wordInput">单词与释义</label>
              <textarea
                id="wordInput"
                class="word-input"
                placeholder="apple&#10;abandon&#10;serendipity"
                spellcheck="false"
              ></textarea>

              <div class="auto-lookup-row">
                <label class="toggle-control auto-lookup-toggle">
                  <input id="autoLookupToggle" type="checkbox" checked />
                  <span class="toggle-track" aria-hidden="true"></span>
                  <span>自动补全释义</span>
                </label>
                <button class="ghost-button auto-fill-button" id="autoFillButton" type="button">
                  <i data-lucide="sparkles"></i>
                  <span>自动补全</span>
                </button>
              </div>

              <div class="lookup-status" id="lookupStatus" aria-live="polite"></div>

              <div class="input-toolbar">
                <div class="format-example">
                  <span class="format-token">单词</span>
                  <span class="format-arrow">→</span>
                  <span class="format-token muted">释义</span>
                </div>
                <button class="ghost-button" id="clearInputButton" type="button">
                  <i data-lucide="eraser"></i>
                  <span>清空</span>
                </button>
              </div>

              <button class="primary-button add-button" id="addWordsButton" type="button">
                <i data-lucide="plus"></i>
                <span>加入词库</span>
              </button>
            </section>

            <section class="panel library-panel" aria-labelledby="libraryTitle">
              <div class="panel-heading library-heading">
                <div>
                  <p class="eyebrow">我的内容</p>
                  <h2 id="libraryTitle">单词列表</h2>
                </div>
                <div class="library-actions">
                  <button class="icon-button subtle-button" id="exportWordsButton" type="button" aria-label="导出词库" title="导出词库">
                    <i data-lucide="download"></i>
                  </button>
                  <button class="icon-button subtle-button" id="clearWordsButton" type="button" aria-label="清空词库" title="清空词库">
                    <i data-lucide="trash-2"></i>
                  </button>
                </div>
              </div>

              <div class="search-box">
                <i data-lucide="search" aria-hidden="true"></i>
                <label class="sr-only" for="searchInput">搜索单词</label>
                <input id="searchInput" type="search" placeholder="搜索单词或释义" autocomplete="off" />
              </div>

              <div class="word-list" id="wordList" aria-live="polite"></div>

              <div class="library-footer">
                <div class="mastery-legend">
                  <span><i class="legend-dot mastered"></i>已熟悉</span>
                  <span><i class="legend-dot reviewing"></i>需复习</span>
                  <span><i class="legend-dot fresh"></i>新词</span>
                </div>
              </div>
            </section>
          </div>

          <section class="panel start-dock" aria-label="开始默写">
            <div class="quiz-options">
              <label class="toggle-control">
                <input id="shuffleToggle" type="checkbox" checked />
                <span class="toggle-track" aria-hidden="true"></span>
                <span>随机顺序</span>
              </label>
              <label class="select-control" for="quizSizeSelect">
                <span>每轮数量</span>
                <select id="quizSizeSelect">
                  <option value="0">全部</option>
                  <option value="5">5 个</option>
                  <option value="10">10 个</option>
                  <option value="20">20 个</option>
                </select>
              </label>
            </div>
            <button class="primary-button start-button" id="startButton" type="button" disabled>
              <i data-lucide="play"></i>
              <span>开始默写</span>
            </button>
          </section>
        </section>

        <section class="view" id="quizView" aria-labelledby="quizTitle" hidden>
          <div class="quiz-header">
            <button class="ghost-button" id="quitQuizButton" type="button">
              <i data-lucide="arrow-left"></i>
              <span>退出</span>
            </button>
            <div class="quiz-progress-wrap">
              <div class="quiz-progress-label" id="quizProgressText">0 / 0</div>
              <div class="progress-track" aria-hidden="true">
                <span class="progress-bar" id="progressBar"></span>
              </div>
            </div>
            <div class="live-stats">
              <span class="live-stat correct-stat" title="本轮答对">
                <i data-lucide="check"></i>
                <span id="correctCount">0</span>
              </span>
              <span class="live-stat streak-stat" title="连续答对">
                <i data-lucide="flame"></i>
                <span id="streakCount">0</span>
              </span>
            </div>
          </div>

          <div class="quiz-stage panel">
            <div class="stage-index">
              <span class="round-chip" id="roundChip">第 1 题</span>
              <span class="stage-kicker" id="stageKicker">默写模式</span>
            </div>
            <div class="meaning-block">
              <span class="meaning-label">释义</span>
              <h1 id="meaningText"></h1>
            </div>

            <form class="answer-form" id="answerForm">
              <label class="sr-only" for="answerInput">输入单词</label>
              <div class="answer-row">
                <input
                  id="answerInput"
                  type="text"
                  autocomplete="off"
                  autocapitalize="none"
                  autocorrect="off"
                  spellcheck="false"
                  placeholder="输入单词"
                  aria-describedby="feedback"
                />
                <button class="check-button" id="checkButton" type="submit">
                  <i data-lucide="corner-down-left"></i>
                  <span>检查</span>
                </button>
              </div>
              <div class="feedback" id="feedback" aria-live="polite"></div>
            </form>

            <div class="stage-actions">
              <button class="soft-button" id="hintButton" type="button">
                <i data-lucide="lightbulb"></i>
                <span>首字母提示</span>
              </button>
              <button class="soft-button" id="revealButton" type="button">
                <i data-lucide="eye"></i>
                <span>显示答案</span>
              </button>
            </div>
          </div>
        </section>

        <section class="view" id="summaryView" aria-labelledby="summaryTitle" hidden>
          <div class="summary-wrap">
            <section class="panel summary-panel">
              <div class="summary-emblem" id="summaryEmblem">
                <i data-lucide="trophy"></i>
              </div>
              <p class="eyebrow">本轮结果</p>
              <h1 id="summaryTitle">完成默写</h1>
              <p class="summary-subtitle" id="summarySubtitle"></p>

              <div class="summary-stats">
                <div class="summary-stat">
                  <span class="summary-value" id="totalStat">0</span>
                  <span class="summary-label">全部单词</span>
                </div>
                <div class="summary-stat">
                  <span class="summary-value success-value" id="correctStat">0</span>
                  <span class="summary-label">最终答对</span>
                </div>
                <div class="summary-stat">
                  <span class="summary-value warning-value" id="reviewStat">0</span>
                  <span class="summary-label">需要复习</span>
                </div>
              </div>

              <div class="review-section" id="reviewSection" hidden>
                <div class="review-title">
                  <i data-lucide="bookmark"></i>
                  <h2>复习清单</h2>
                </div>
                <div class="review-list" id="reviewList"></div>
              </div>

              <div class="summary-actions">
                <button class="primary-button" id="practiceWeakButton" type="button">
                  <i data-lucide="repeat-2"></i>
                  <span>再练错词</span>
                </button>
                <button class="secondary-button" id="restartQuizButton" type="button">
                  <i data-lucide="rotate-cw"></i>
                  <span>再来一轮</span>
                </button>
                <button class="ghost-button" id="backToLibraryButton" type="button">
                  <i data-lucide="book-open"></i>
                  <span>返回词库</span>
                </button>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
